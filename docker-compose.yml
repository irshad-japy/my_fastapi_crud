version: "3.8"

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: test_db
      MYSQL_USER: pocuser
      MYSQL_PASSWORD: rootpassword

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
